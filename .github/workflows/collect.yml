name: Raccogli quote

on:
  schedule:
    - cron: "7 */3 * * *"   # ogni 3 ore; lo script salta da solo i giri non necessari
  workflow_dispatch:         # permette di lanciarlo a mano dal pulsante "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccolta quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          H=$(date -u +%H)
          NOW=$(date -u +%Y%m%d%H)
          FLAGS=""
          if [ "$NOW" -lt 2026102608 ]; then
            # MODALITA WEEKEND (fino a lunedi 26/10 alle 08 UTC): 1X2 + Over/Under + Goal/NoGoal
            FLAGS="--markets totals,btts --btts-max 10 --btts-hours 30"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$H" = "00" ] || [ "$H" = "03" ]; }; then
              echo "Notte: salto questo giro per risparmiare crediti."
              exit 0
            fi
          else
            # DOPO IL WEEKEND: torna a un giro ogni 6 ore, solo 1X2
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ $((10#$H % 6)) -ne 0 ]; then
              echo "Fuori weekend: salto questo giro."
              exit 0
            fi
          fi
          python collector.py --leagues soccer_italy_serie_a,soccer_italy_serie_b,soccer_epl,soccer_spain_la_liga $FLAGS

      - name: Salva lo storico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.db data.js
          git diff --cached --quiet || (git commit -m "Aggiorna quote" && git push)

      - name: Prepara il sito
        run: |
          mkdir _site
          cp index.html data.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
