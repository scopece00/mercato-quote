name: Raccogli quote

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccolta quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python collector.py --leagues soccer_italy_serie_a,soccer_italy_serie_b,soccer_epl,soccer_spain_la_liga

      - name: Salva lo storico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.db data.js
          git diff --cached --quiet || (git commit -m "Aggiorna quote" && git push)

      - name: Prepara il sito
        run: |
          mkdir _site
          cp index.html data.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
